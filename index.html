<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemoryEcho（記憶迴響）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="app-container">

    <!-- 長者端：復古木質收音機 -->
    <section class="device-section">
      <h2 class="section-title">長者端：復古木質收音機</h2>

      <div class="radio-device-wrapper">
        <!-- 頂部提把 -->
        <div class="radio-handle"></div>

        <!-- 收音機主機身 -->
        <div class="radio-chassis">
          <!-- 左側：螢幕與說故事按鍵 -->
          <div class="chassis-left">
            <div class="radio-screen" id="radioScreen">
              <div class="screen-indicator-wrap">
                <div class="indicator-led state-standby" id="screenIndicatorLed"></div>
              </div>
              <div class="screen-content">
                <div class="screen-text" id="radioScreenText">阿姨，要不要
聊聊年輕的事？</div>
              </div>
            </div>

            <button type="button" class="btn-story" id="btnStory">說故事</button>
          </div>

          <!-- 右側：音量旋鈕與一鍵復原按鍵 -->
          <div class="chassis-right">
            <div class="knob-container">
              <div class="rotary-knob" id="rotaryKnob">
                <div class="knob-inner"></div>
              </div>
              <div class="knob-label">音量</div>
            </div>

            <button type="button" class="btn-reset" id="btnReset">一鍵復原</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 青年端：手機 App 畫面 -->
    <section class="device-section">
      <h2 class="section-title">青年端：手機 App</h2>

      <div class="mobile-phone-frame">
        <div class="phone-screen">
          <div class="phone-status-bar">
            <span>15:00</span>
            <span>5G 📶 100% 🔋</span>
          </div>

          <div class="phone-app-header">
            <div class="phone-app-title">MemoryEcho</div>
            <div class="phone-user-chip">陳家豪</div>
          </div>

          <div class="phone-body">
            <!-- 長者傳來的故事卡（只保留故事文字） -->
            <div class="youth-story-card">
              <div class="card-top-meta">
                <div class="elder-avatar">秀英</div>
                <div class="elder-meta-info">
                  <span class="elder-meta-name">林秀英（72 歲）</span>
                  <span class="elder-meta-time">1970 年代大稻埕</span>
                </div>
              </div>

              <div class="card-story-text" id="youthStoryText">
                以前大稻埕故事很多，我有好多以前在大稻埕教書的照片…
              </div>
            </div>
          </div>

          <!-- 下方只留「點讚」和「語音回覆」兩個按鈕 -->
          <div class="youth-actions-bar">
            <button type="button" class="btn-youth-action" id="youthBtnLike">點讚</button>
            <button type="button" class="btn-youth-action" id="youthBtnVoice">語音回覆</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
